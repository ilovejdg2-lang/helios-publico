<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Quirón">
  <!-- Compact illustrated Quirón for avatars / FAB (vector recreation from brand sheet) -->
  <defs>
    <clipPath id="visor">
      <ellipse cx="64" cy="58" rx="28" ry="22"/>
    </clipPath>
  </defs>
  <!-- headphones band -->
  <path d="M28 52c0-24 16-40 36-40s36 16 36 40" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round"/>
  <!-- ear cups -->
  <circle cx="28" cy="58" r="14" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="100" cy="58" r="14" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="28" cy="58" r="6" fill="#f5004f"/>
  <circle cx="100" cy="58" r="6" fill="#f5004f"/>
  <!-- head -->
  <ellipse cx="64" cy="56" rx="34" ry="32" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
  <!-- visor -->
  <ellipse cx="64" cy="58" rx="28" ry="22" fill="#f5004f" stroke="#0a0a0a" stroke-width="3.5"/>
  <!-- smiling eyes -->
  <g clip-path="url(#visor)">
    <path d="M48 60c4-8 12-8 16 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M64 60c4-8 12-8 16 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- cape hint -->
  <path d="M38 88c8 18 40 22 52 0" fill="#fff" stroke="#0a0a0a" stroke-width="3.5"/>
  <circle cx="64" cy="90" r="6" fill="#f5004f" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- speech bubble -->
  <g transform="translate(92 18)">
    <ellipse cx="14" cy="12" rx="14" ry="11" fill="#f5004f" stroke="#0a0a0a" stroke-width="2.5"/>
    <circle cx="8" cy="12" r="2.2" fill="#fff"/>
    <circle cx="14" cy="12" r="2.2" fill="#fff"/>
    <circle cx="20" cy="12" r="2.2" fill="#fff"/>
  </g>
</svg>
