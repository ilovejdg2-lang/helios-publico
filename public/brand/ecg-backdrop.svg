<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" fill="none">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#F5004F" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <linearGradient id="waveSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5004F" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#F5004F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5004F" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1000" fill="url(#grid)"/>

  <!-- Onda ECG grande -->
  <path
    d="M40 620 C180 620 220 620 280 520 C360 360 400 820 480 560 C540 380 580 620 700 620 C820 620 880 420 960 540 C1040 660 1100 520 1220 560 L1380 580"
    stroke="url(#waveSoft)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path
    d="M120 420 C240 420 280 340 340 250 C400 160 430 520 510 340 C570 210 630 420 760 420"
    stroke="#F5004F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.22"/>

  <!-- Etiquetas P QRS T U -->
  <g fill="#F5004F" opacity="0.28" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">
    <text x="250" y="210">P</text>
    <text x="400" y="150">QRS</text>
    <text x="580" y="230">T</text>
    <text x="700" y="280">U</text>
  </g>

  <!-- Corazón grande con pulso (pieza clave del fondo) -->
  <g transform="translate(780 120)" opacity="0.42">
    <path
      d="M110 78c0-36 30-66 68-66 24 0 45 12 55 31 10-19 31-31 55-31 38 0 68 30 68 66 0 72-123 140-123 140S110 150 110 78z"
      fill="#F5004F"/>
    <path
      d="M140 88h42l16-38 22 76 16-38h48"
      stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Trazo fino adicional -->
  <path
    d="M860 380 C940 380 970 320 1010 280 C1050 240 1080 420 1130 330 C1170 260 1210 380 1280 380"
    stroke="#F5004F" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.18"/>
</svg>
